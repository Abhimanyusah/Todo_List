<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container todo-container">
        <h1 class="text-center mb-4">To-Do List</h1>
        <div class="d-flex mb-3">
            <input type="text" id="todo-input" class="form-control me-2" placeholder="Add a new task" />
            <button id="add-btn" class="btn btn-success">Add</button>
        </div>

        <ul id="todo-list" class="list-group">
            <!-- Tasks Added here -->
        </ul>
    </div>

    <!-- Bootstrap JS and dependencies (Popper and Bootstrap Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="app2.js"></script>

</body>
</html>
